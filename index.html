<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Star Refrigeration Check System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .status-green { background-color: #d1e7dd !important; color: #0f5132 !important; }
        .status-yellow { background-color: #fff3cd !important; color: #664d03 !important; }
        .status-red { background-color: #f8d7da !important; color: #842029 !important; font-weight: bold !important; }
        .field-error { border: 2px dashed #dc3545 !important; background-color: #fff5f5 !important; }
        .status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        .dot-red { background-color: #dc3545; box-shadow: 0 0 6px #dc3545; }
        .dot-yellow { background-color: #ffc107; box-shadow: 0 0 6px #ffc107; }
        .dot-green { background-color: #198754; box-shadow: 0 0 6px #198754; }
        .dot-gray { background-color: #6c757d; }
        .section-block { border: 1px solid #dee2e6; border-radius: 6px; padding: 15px; margin-bottom: 15px; background: white; scroll-margin-top: 80px; }
        .section-confirmed { border-left: 5px solid #198754; background-color: #f8fffb; }
        .section-has-error { border-left: 5px solid #dc3545; background-color: #fffafd; }
        .inline-action-box { background-color: #fff; border: 1px solid #dc3545; border-radius: 4px; padding: 12px; margin-top: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
        .dashboard-badge { display: flex; flex-direction: column; padding: 10px; background: #fff; border: 1px solid #dee2e6; border-radius: 4px; font-size: 12px; }
        .dashboard-badge.badge-danger-alert { border: 2px solid #dc3545; background-color: #fff8f8; }
        .dashboard-badge.badge-warning-alert { border: 2px solid #ffc107; background-color: #fffff2; }
        .badge-action-text { font-size: 10px; font-style: italic; margin-top: 4px; border-top: 1px dashed #dee2e6; padding-top: 4px; }
        .text-red-alert { color: #b02a37; }
        .text-yellow-alert { color: #664d03; }
        .custom-yellow-notes-badge { background-color: #ffc107 !important; color: #000000 !important; font-weight: 700 !important; border: 2px solid #000000 !important; }
        .history-nav-btn { padding: 2px 10px; font-size: 13px; font-weight: bold; border-radius: 4px; }
        .live-indicator { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-locked-state { opacity: 0.4; pointer-events: none; }
        .alert-item-container { scroll-margin-top: 80px; padding: 6px; border-radius: 4px; transition: background-color 0.3s; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center bg-dark text-white p-3 rounded card mb-3">
        <div>
            <h2 class="mb-0">Five Star Refrigeration Engine</h2>
            <small>Dynamic Self-Assembling Interface Layout Module</small>
        </div>
        <span class="badge bg-primary fs-6" id="liveClock"></span>
    </div>

    <div class="card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-baseline border-bottom pb-2 mb-3">
            <div class="d-flex align-items-center gap-3">
                <h4 class="text-secondary mb-0">🚨 System Status Dashboard</h4>
                <div class="btn-group shadow-sm" role="group">
                    <button type="button" class="btn btn-outline-secondary btn-sm history-nav-btn" id="navPrevBtn" onclick="navigateHistory(-1)">◀ Back</button>
                    <button type="button" class="btn btn-outline-primary btn-sm history-nav-btn" id="navLiveBtn" onclick="jumpToLiveStream()">Live</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm history-nav-btn" id="navNextBtn" onclick="navigateHistory(1)">Forward ▶</button>
                </div>
                <span id="dashboardModeIndicator" class="badge bg-success live-indicator">● Real-Time Cloud</span>
            </div>
            <div class="text-end" style="max-width: 45%;">
                <span class="text-muted d-block small mb-1 fw-semibold" id="latestLogMeta">Fetching entries...</span>
                <span class="badge custom-yellow-notes-badge text-wrap text-start fs-6" style="display: inline-block; word-break: break-word;" id="dashboardNotesView">Notes: None Logged</span>
            </div>
        </div>
        <div class="dashboard-grid" id="fullWidthStatusDashboard">Loading active floor metrics configuration...</div>
    </div>

    <div class="card p-3 mb-4 bg-light border-warning">
        <h5 class="text-dark fw-bold mb-2">⚙️ Manager Asset Governance Console</h5>
        <div class="row g-2">
            <div class="col-md-3">
                <select id="mgmtSection" class="form-select form-select-sm">
                    <option value="sec1">🥛 1. Dairy / Refrigerated Cases</option>
                    <option value="sec2">🍦 2. Ice Cream Cases</option>
                    <option value="sec3">📦 3. Frozen Prepared Cases</option>
                    <option value="sec4">🥩 4. Fresh Meat Cases</option>
                    <option value="sec5">🥪 5. Deli Lunchmeat Cases</option>
                    <option value="sec6">🍎 6. Fresh Produce Cases</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="text" id="mgmtCoolerName" class="form-control form-control-sm" placeholder="Cooler Name">
            </div>
            <div class="col-md-2">
                <input type="number" id="mgmtPlacementOrder" class="form-control form-control-sm" placeholder="Line Rank" min="1">
            </div>
            <div class="col-md-2">
                <input type="password" id="mgmtAuthCode" class="form-control form-control-sm" placeholder="Manager PIN">
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-success btn-sm w-100 fw-bold" onclick="modifyAssetRegistry('REGISTER_NEW_COOLER')">➕ Add</button>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-danger btn-sm w-100 fw-bold" onclick="modifyAssetRegistry('PURGE_EXISTING_COOLER')">🗑️ Drop</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-lg-7">
            <div class="card p-4 shadow-sm border-primary" style="border-width: 2px;">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                    <h4 class="text-secondary mb-0">📝 Digital Floor Log Sheet</h4>
                    <button type="button" id="kioskSessionBtn" onclick="toggleKioskFormInterlock()" class="btn btn-success fw-bold px-4 shadow-sm">🟢 Start New Inspection Route</button>
                </div>
                
                <form id="masterForm" class="form-locked-state" novalidate>
                    <div class="row mb-4 bg-light p-3 rounded border">
                        <div class="col-6">
                            <label class="form-label fw-bold">Inspector Initials</label>
                            <input type="text" id="initials" class="form-control" placeholder="e.g. RM" oninput="saveDraftProgressData()">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">Shift Window</label>
                            <select id="shift" class="form-control" onchange="saveDraftProgressData()">
                                <option value="" disabled selected>Select Shift Window...</option>
                                <option value="7-8AM">7-8 AM Shift (6AM-9AM)</option>
                                <option value="3PM">3 PM Shift (2PM-5PM)</option>
                                <option value="9PM">9 PM Shift (7PM-9:30PM)</option>
                                <option value="Recheck">Recheck (Ad-Hoc Check)</option>
                            </select>
                        </div>
                    </div>

                    <div id="dynamicWizardContainer"></div>

                    <div class="bg-light p-3 rounded border mb-3">
                        <label class="form-label fw-bold text-secondary">📋 Freehand Inspector Shift Notes</label>
                        <textarea id="freehandNotes" class="form-control" rows="2" placeholder="Enter custom log observations or rack notes..." oninput="saveDraftProgressData()"></textarea>
                    </div>

                    <button type="button" id="validateFormBtn" onclick="runStageOneValidation()" class="btn btn-primary w-100 mt-2 py-2 shadow-sm fw-bold fs-5">🔍 Step 1: Validate Floor Sheet</button>
                    <button type="button" id="validateActionsBtn" style="display:none;" onclick="runStageTwoValidation()" class="btn btn-warning w-100 mt-2 py-2 shadow-sm fw-bold fs-5 text-dark">🛡️ Step 2: Verify Corrections</button>
                    <button type="button" id="finalSubmitBtn" disabled onclick="transmitLogsToCloud()" class="btn btn-secondary w-100 mt-2 py-3 shadow-sm fw-bold fs-5">🔒 Complete Log & Submit to Sheet</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const cloudSpreadsheetURL = "https://script.google.com/macros/s/AKfycbzRmclZTiSPNpgdAAPey58Lf7opzlJCx_dyc0mCUwSLlzPxorY9GGMa8LG8tHfzhjXF/exec";

    const limitsSchema = {
        sec1: { title: "🥛 1. Dairy / Refrigerated", min: 31, max: 40 },
        sec2: { title: "🍦 2. Ice Cream / Frozen", min: -10, max: 10 },
        sec3: { title: "📦 3. Frozen Prepared Foods", min: -10, max: 10 },
        sec4: { title: "🥩 4. Fresh Meat / Seafood", min: 32, max: 38 },
        sec5: { title: "🥪 5. Deli / Lunchmeat Cases", min: 31, max: 40 },
        sec6: { title: "🍎 6. Fresh Produce Displays", min: 32, max: 55 }
    };

    let activeStructuralMap = {};
    let localCacheHistory = []; 
    let currentViewerIndex = -1; 
    let backgroundRefreshPollerId = null; 
    let isInspectionActive = false;
    let runtimeCheckboxStateMemory = {};

    function determineStatusClass(value, limits) {
        if (isNaN(value) || value === null || value === "") return "";
        if (value < limits.min || value > limits.max) return "status-red";
        if (value <= (limits.min + 2) || value >= (limits.max - 2)) return "status-yellow";
        return "status-green";
    }

    function evaluateFieldStyle(inputElement, sectionId) {
        const value = parseFloat(inputElement.value);
        if (!isNaN(value)) {
            inputElement.classList.remove('status-green', 'status-yellow', 'status-red', 'field-error');
            inputElement.classList.add(determineStatusClass(value, limitsSchema[sectionId]));
        }
        saveDraftProgressData(); // Auto-save on every character typed
        lockSubmissionOnChanges();
    }

    function lockSubmissionOnChanges() {
        document.getElementById('finalSubmitBtn').disabled = true;
        document.getElementById('finalSubmitBtn').classList.replace('btn-success', 'btn-secondary');
        document.getElementById('validateActionsBtn').style.display = "none";
    }

    // AUTO-SAVING RECOVERY CORE: Saves layout state data to physical drive memory cache
    function saveDraftProgressData() {
        if (!isInspectionActive) return;
        
        let draft = {
            initials: document.getElementById('initials').value,
            shift: document.getElementById('shift').value,
            freehandNotes: document.getElementById('freehandNotes').value,
            temperatures: {},
            checkboxes: runtimeCheckboxStateMemory
        };
        
        document.querySelectorAll('input[data-sec]').forEach(input => {
            draft.temperatures[input.getAttribute('data-name')] = input.value;
        });
        
        localStorage.setItem('five_star_active_draft_session', JSON.stringify(draft));
    }

    // AUTO-SAVING RECOVERY CORE: Inspects disk memory cache for saved state data to auto-fill
    function loadSavedDraftProgressData() {
        let rawDraft = localStorage.getItem('five_star_active_draft_session');
        if (!rawDraft) return;
        
        let draft = JSON.parse(rawDraft);
        isInspectionActive = true;
        clearInterval(backgroundRefreshPollerId);
        
        document.getElementById('initials').value = draft.initials || "";
        document.getElementById('shift').value = draft.shift || "";
        document.getElementById('freehandNotes').value = draft.freehandNotes || "";
        runtimeCheckboxStateMemory = draft.checkboxes || {};
        
        document.querySelectorAll('input[data-sec]').forEach(input => {
            let name = input.getAttribute('data-name');
            if (draft.temperatures[name] !== undefined) {
                input.value = draft.temperatures[name];
                evaluateFieldStyle(input, input.getAttribute('data-sec'));
            }
        });
        
        // Transform the UI control knobs to active logging states
        document.getElementById('masterForm').classList.remove('form-locked-state');
        const sessionBtn = document.getElementById('kioskSessionBtn');
        sessionBtn.innerText = "🛑 Cancel & Reset Route";
        sessionBtn.className = "btn btn-danger fw-bold px-4 shadow-sm";
    }

    function toggleKioskFormInterlock() {
        const targetForm = document.getElementById('masterForm');
        const sessionBtn = document.getElementById('kioskSessionBtn');
        
        if (!isInspectionActive) {
            isInspectionActive = true;
            clearInterval(backgroundRefreshPollerId); 
            runtimeCheckboxStateMemory = {};
            
            sessionBtn.innerText = "⏳ Syncing Store Database Layout...";
            sessionBtn.className = "btn btn-secondary fw-bold px-4 shadow-sm";
            
            fetch(cloudSpreadsheetURL)
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    activeStructuralMap = res.structural_schema;
                    renderDynamicFormElements(res.structural_schema);
                    if (res.historical_ledger_packages) localCacheHistory = res.historical_ledger_packages;
                    
                    targetForm.classList.remove('form-locked-state');
                    sessionBtn.innerText = "🛑 Cancel & Reset Route";
                    sessionBtn.className = "btn btn-danger fw-bold px-4 shadow-sm";
                    saveDraftProgressData(); // Initialize draft snapshot anchor line
                }
            });
        } else {
            if (confirm("Are you sure you want to cancel? This will completely erase all progress and saved drafts.")) {
                localStorage.removeItem('five_star_active_draft_session'); // Vaporize draft cache file
                forceSessionShutdownReset();
            }
        }
    }

    function forceSessionShutdownReset() {
        isInspectionActive = false;
        runtimeCheckboxStateMemory = {};
        localStorage.removeItem('five_star_active_draft_session');
        document.getElementById('masterForm').reset();
        document.getElementById('masterForm').classList.add('form-locked-state');
        
        const sessionBtn = document.getElementById('kioskSessionBtn');
        sessionBtn.innerText = "🟢 Start New Inspection Route";
        sessionBtn.className = "btn btn-success fw-bold px-4 shadow-sm";
        
        lockSubmissionOnChanges();
        pullSystemStructure();
        startAutomaticDashboardPolling(); 
    }

    function startAutomaticDashboardPolling() {
        clearInterval(backgroundRefreshPollerId);
        backgroundRefreshPollerId = setInterval(() => {
            if (!isInspectionActive && currentViewerIndex === -1) { pullSystemStructure(); }
        }, 20000);
    }

    function pullSystemStructure() {
        fetch(cloudSpreadsheetURL)
        .then(res => res.json())
        .then(res => {
            if (res.status === "success") {
                activeStructuralMap = res.structural_schema;
                if (!isInspectionActive) { renderDynamicFormElements(res.structural_schema); }
                if (res.historical_ledger_packages) localCacheHistory = res.historical_ledger_packages;
                
                // If a localized session state file is recovered, trigger automated field populations
                if (localStorage.getItem('five_star_active_draft_session') && !isInspectionActive) {
                    renderDynamicFormElements(res.structural_schema);
                    loadSavedDraftProgressData();
                }
                
                if (currentViewerIndex === -1) processDashboardViewUpdate(res.current_status, true, res.meta_last_log);
            }
        });
    }

    function renderDynamicFormElements(schema) {
        const container = document.getElementById('dynamicWizardContainer');
        container.innerHTML = '';
        for (let secId in limitsSchema) {
            let assets = schema[secId] || [];
            if (assets.length === 0) continue;
            let html = `<div class="section-block" id="block-${secId}">
                <h5 class="fw-bold text-primary mb-3">${limitsSchema[secId].title} (${limitsSchema[secId].min}°F - ${limitsSchema[secId].max}°F)</h5>
                <div class="row g-2">`;
            assets.forEach((asset, idx) => {
                let identifier = `${secId}_${idx}`;
                html += `<div class="col-6 alert-item-container" id="container-${identifier}">
                    <label class="small fw-semibold text-muted d-block text-truncate">${asset}</label>
                    <input type="number" data-sec="${secId}" data-name="${asset}" id="input-${identifier}" class="form-control form-control-sm" step="0.1" oninput="evaluateFieldStyle(this, '${secId}')">
                </div>`;
            });
            html += `</div><div class="dynamic-action-area mt-3" id="actions-${secId}"></div></div>`;
            container.innerHTML += html;
        }
    }

    function saveActiveCheckboxesToMemory() {
        document.querySelectorAll('.action-checkbox-node').forEach(cb => {
            const coolerKey = cb.getAttribute('data-cooler-key');
            const val = cb.value;
            if (!runtimeCheckboxStateMemory[coolerKey]) {
                runtimeCheckboxStateMemory[coolerKey] = {};
            }
            runtimeCheckboxStateMemory[coolerKey][val] = cb.checked;
        });
        saveDraftProgressData(); // Mirror checkboxes to storage draft immediately
    }

    function navigateHistory(direction) {
        if (isInspectionActive) { alert("⚠️ Cannot browse history while an active inspection route is open."); return; }
        if (localCacheHistory.length === 0) { alert("📋 No logs discovered in database yet."); return; }
        if (currentViewerIndex === -1) { currentViewerIndex = localCacheHistory.length - 1; } 
        else { currentViewerIndex += direction; }

        if (currentViewerIndex >= localCacheHistory.length) { jumpToLiveStream(); return; }
        if (currentViewerIndex < 0) { currentViewerIndex = 0; alert("⏮️ Reached oldest historical data row block."); return; }

        const targetedRecord = localCacheHistory[currentViewerIndex];
        processDashboardViewUpdate(targetedRecord.status_map, false, targetedRecord.meta_string);

        const modeInd = document.getElementById('dashboardModeIndicator');
        modeInd.innerText = `Report [${currentViewerIndex + 1}/${localCacheHistory.length}]`;
        modeInd.className = "badge bg-warning text-dark live-indicator";
    }

    function jumpToLiveStream() {
        currentViewerIndex = -1;
        const modeInd = document.getElementById('dashboardModeIndicator');
        modeInd.innerText = "● Real-Time Cloud";
        modeInd.className = "badge bg-success live-indicator";
        pullSystemStructure();
    }

    function processDashboardViewUpdate(statusMap, isLiveCloudData, metaString) {
        let prefixText = isLiveCloudData ? "Last Logged: " : "Viewing Past Report: ";
        document.getElementById('latestLogMeta').innerText = `${prefixText}${metaString}`;
        
        let extractedNotes = "None Logged";
        for (let key in statusMap) {
            if (statusMap[key] && statusMap[key].notes_field) {
                extractedNotes = statusMap[key].notes_field;
                break;
            }
        }
        document.getElementById('dashboardNotesView').innerText = "Notes: " + extractedNotes;
        renderDashboardLights(activeStructuralMap, statusMap);
    }

    function renderDashboardLights(schema, statusRecords) {
        const dashboard = document.getElementById('fullWidthStatusDashboard');
        dashboard.innerHTML = '';
        for (let secId in limitsSchema) {
            let assets = schema[secId] || [];
            assets.forEach(assetName => {
                let data = statusRecords[assetName] || { temp: "N/A", action: "" };
                let lightClass = "dot-gray"; let alertClass = ""; let actionableTextDiv = "";
                
                if (data.temp !== "N/A" && data.temp !== undefined && data.temp !== "") {
                    let actualVal = parseFloat(data.temp);
                    let cls = determineStatusClass(actualVal, limitsSchema[secId]);
                    if (cls === "status-red") { 
                        lightClass = "dot-red"; alertClass = "badge-danger-alert"; 
                        let actText = data.action || "Action Logged";
                        actionableTextDiv = `<div class="badge-action-text text-red-alert">🛠️ ${actText}</div>`;
                    }
                    else if (cls === "status-yellow") { 
                        lightClass = "dot-yellow"; alertClass = "badge-warning-alert"; 
                        let actText = data.action || "Rechecking in 1 Hour";
                        actionableTextDiv = `<div class="badge-action-text text-yellow-alert">⏳ ${actText}</div>`;
                    }
                    else if (cls === "status-green") { lightClass = "dot-green"; }
                    valueText = `${actualVal}°F`;
                } else { valueText = "N/A"; }
                
                dashboard.innerHTML += `<div class="dashboard-badge shadow-sm ${alertClass}">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <div class="text-truncate" style="max-width:140px;">
                            <span class="status-dot ${lightClass}"></span><span class="fw-semibold">${assetName}</span>
                        </div>
                        <span class="fw-bold text-secondary">${valueText}</span>
                    </div>
                    ${actionableTextDiv}
                </div>`;
            });
        }
    }

    function runStageOneValidation() {
        const initials = document.getElementById('initials').value.trim();
        const shift = document.getElementById('shift').value;
        if (!initials || !shift) { alert("⚠️ Missing Initials or Shift selection."); return; }
        
        saveActiveCheckboxesToMemory();
        let formHasMissingFields = false; 
        let errorsLogged = 0;
        let firstBlankInputId = null;
        let firstFailedSectionId = null;
        
        document.querySelectorAll(".section-block").forEach(el => el.classList.remove('section-confirmed', 'section-has-error'));
        document.querySelectorAll(".dynamic-action-area").forEach(el => el.innerHTML = '');

        for (let secId in limitsSchema) {
            let blockHasError = false;
            let actionHtml = `<div class="inline-action-box"><h6 class="text-dark fw-bold mb-2">🚨 Corrective Actions Required:</h6>`;
            let inputs = document.querySelectorAll(`input[data-sec="${secId}"]`);
            
            inputs.forEach(input => {
                let val = input.value.trim();
                if (val === '') { 
                    input.classList.add('field-error'); 
                    formHasMissingFields = true; 
                    if (!firstBlankInputId) firstBlankInputId = input.id;
                } 
                else {
                    let num = parseFloat(val);
                    let status = determineStatusClass(num, limitsSchema[secId]);
                    if (status === "status-red" || status === "status-yellow") {
                        blockHasError = true; 
                        errorsLogged++;
                        if (!firstFailedSectionId) firstFailedSectionId = secId;
                        let assetName = input.getAttribute('data-name');
                        
                        actionHtml += `<div class="mb-2 pb-2 border-bottom alert-protocol-wrapper" data-alert-type="${status === 'status-red' ? 'CRITICAL-ALERT' : 'CAUTION-RECHECK'}" data-cooler="${assetName}">
                            <span class="badge ${status === 'status-red' ? 'bg-danger' : 'bg-warning text-dark'} mb-1">${assetName}: ${num}°F</span>
                            <div class="row g-1">`;
                        if (status === "status-yellow") {
                            actionHtml += `<div class="col-12"><div class="form-check">
                                <input class="form-check-input action-checkbox-node" type="checkbox" checked data-cooler-key="${assetName}" value="Rechecking in 1 Hour" id="chk-${assetName}-recheck">
                                <label class="form-check-label text-dark fw-bold" style="font-size:11px;" for="chk-${assetName}-recheck">Rechecking in 1 Hour (Enforced Compliance)</label>
                            </div></div>`;
                        } else {
                            [
                                "Moved Product to Cooler",
                                "Moved Product to Freezer",
                                "Turned off to allow Defrost",
                                "Scheduled Service Call",
                                "Scheduled Emergency Service",
                                "Notified Management Team",
                                "Checked Rack for Alarms see notes",
                                "Rechecking in 1 Hour"
                            ].forEach((act, idx) => {
                                let isCheckedState = (runtimeCheckboxStateMemory[assetName] && runtimeCheckboxStateMemory[assetName][act] === true) ? "checked" : "";
                                actionHtml += `<div class="col-6"><div class="form-check">
                                    <input class="form-check-input action-checkbox-node" type="checkbox" ${isCheckedState} data-cooler-key="${assetName}" value="${act}" id="chk-${assetName}-${idx}">
                                    <label class="form-check-label text-dark" style="font-size:10px;" for="chk-${assetName}-${idx}">${act}</label>
                                </div></div>`;
                            });
                        }
                        actionHtml += `</div></div>`;
                    }
                }
            });
            if (blockHasError) {
                document.getElementById(`block-${secId}`).classList.add('section-has-error');
                document.getElementById(`actions-${secId}`).innerHTML = actionHtml + `</div>`;
            } else { 
                document.getElementById(`block-${secId}`).classList.add('section-confirmed'); 
            }
        }

        if (formHasMissingFields) { 
            alert("⚠️ Missing Entries: Fill in all highlighted empty boxes."); 
            if (firstBlankInputId) {
                setTimeout(() => {
                    let targetInput = document.getElementById(firstBlankInputId);
                    if (targetInput) { targetInput.scrollIntoView({ behavior: 'smooth', block: 'center' }); targetInput.focus(); }
                }, 150);
            }
            return; 
        }
        
        if (errorsLogged > 0) {
            document.getElementById('validateActionsBtn').style.display = "block";
            alert(`⚠️ Action Required: Detected ${errorsLogged} temperature issues. Complete corrective protocols below.`);
            if (firstFailedSectionId) {
                setTimeout(() => {
                    let targetSectionBlock = document.getElementById(`block-${firstFailedSectionId}`);
                    if (targetSectionBlock) { targetSectionBlock.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
                }, 150);
            }
            return;
        }

        document.getElementById('finalSubmitBtn').disabled = false;
        document.getElementById('finalSubmitBtn').classList.replace('btn-secondary', 'btn-success');
        alert("✅ Worksheet successfully verified! Data submission switch opened.");
    }

    function runStageTwoValidation() {
        saveActiveCheckboxesToMemory();
        const wrappers = document.querySelectorAll('.alert-protocol-wrapper');
        let fail = false;
        let firstFailedWrapper = null;
        
        wrappers.forEach(wrap => {
            let checked = wrap.querySelectorAll('.action-checkbox-node:checked');
            if (checked.length === 0) { 
                fail = true; 
                wrap.style.border = "2px solid #dc3545"; 
                wrap.style.backgroundColor = "#fff5f5"; 
                if (!firstFailedWrapper) firstFailedWrapper = wrap;
            } 
            else { wrap.style.border = "none"; wrap.style.backgroundColor = "transparent"; }
        });
        
        if (fail) { 
            alert("⚠️ Verification Denied. Choose action protocols for highlighted areas."); 
            if (firstFailedWrapper) { firstFailedWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            return; 
        }
        
        document.getElementById('finalSubmitBtn').disabled = false;
        document.getElementById('finalSubmitBtn').classList.replace('btn-secondary', 'btn-success');
        alert("✅ Actions verified. Submission unlocked.");
    }

    function transmitLogsToCloud() {
        saveActiveCheckboxesToMemory();
        const submitBtn = document.getElementById('finalSubmitBtn');
        submitBtn.disabled = true; submitBtn.innerText = "⏳ Synchronizing Log Stream...";
        let package = [];
        let sharedNotes = document.getElementById('freehandNotes').value.trim() || "None Logged";
        
        document.querySelectorAll('input[data-sec]').forEach(input => {
            let assetName = input.getAttribute('data-name');
            let matchedAction = "None Required";
            
            if (runtimeCheckboxStateMemory[assetName]) {
                let activeMeasures = [];
                for (let actionText in runtimeCheckboxStateMemory[assetName]) {
                    if (runtimeCheckboxStateMemory[assetName][actionText] === true) {
                        activeMeasures.push(actionText);
                    }
                }
                if (activeMeasures.length > 0) matchedAction = activeMeasures.join(" | ");
            }
            
            package.push({
                department: limitsSchema[input.getAttribute('data-sec')].title,
                cooler_name: assetName,
                temperature: parseFloat(input.value),
                action_taken: matchedAction
            });
        });

        fetch(cloudSpreadsheetURL, {
            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                routing_action: "SUBMIT_DATA_STREAM",
                time: new Date().toLocaleString(),
                user: document.getElementById('initials').value.toUpperCase(),
                shift: document.getElementById('shift').value,
                inspector_notes: sharedNotes, 
                records_package: package
            })
        }).then(() => {
            alert("🚀 Log secure-synced to spreadsheet records!");
            forceSessionShutdownReset(); 
        });
    }

    function modifyAssetRegistry(routingActionName) {
        let section = document.getElementById('mgmtSection').value;
        let coolerName = document.getElementById('mgmtCoolerName').value.trim();
        let orderRank = document.getElementById('mgmtPlacementOrder').value.trim();
        let code = document.getElementById('mgmtAuthCode').value.trim();
        if (!coolerName || !code) { alert("⚠️ Asset name and authorization PIN are strictly required."); return; }
        if (!confirm(`Commit configuration changes to the store layout?`)) return;

        fetch(cloudSpreadsheetURL, {
            method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                routing_action: routingActionName,
                target_section: section,
                new_asset_name: coolerName,
                asset_name: coolerName,
                target_order: orderRank,
                auth_code: code
            })
        }).then(() => {
            alert("⚙️ Configuration modified!");
            document.getElementById('mgmtCoolerName').value = '';
            document.getElementById('mgmtPlacementOrder').value = '';
            document.getElementById('mgmtAuthCode').value = '';
            setTimeout(pullSystemStructure, 1000);
        });
    }

    window.onload = function() {
        pullSystemStructure();
        startAutomaticDashboardPolling(); 
    };
</script>
